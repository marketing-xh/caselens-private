services:
  - type: web
    name: caselens-social-cases
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: CASELENS_CLOUD
        value: "1"
      - key: CASELENS_PASSWORD
        sync: false
