<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaseLens · 内部访问申请</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#18263b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#e7ecff,transparent 45%),#f3f6fa;display:grid;place-items:center;padding:28px}.box{width:min(640px,100%);background:white;border:1px solid #dce5f0;border-radius:24px;padding:33px;box-shadow:0 22px 60px #20355713}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:22px}.mark{background:linear-gradient(135deg,#5861eb,#9563e7);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:#fff}.hint{font-size:13px;color:#718099;line-height:1.7}.tabs{display:flex;gap:9px;margin:27px 0 18px;padding:5px;background:#f0f3f8;border-radius:13px}.tabs button{flex:1;border:0;background:transparent;padding:11px;color:#62738d;border-radius:9px;font-weight:700;cursor:pointer}.tabs button.on{background:white;color:#1f3352;box-shadow:0 1px 4px #172c4715}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;color:#485b76;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px 14px;border:1px solid #d5e0ec;border-radius:10px;font:inherit;outline:none}.field textarea{resize:vertical;min-height:80px}.field input:focus,.field textarea:focus{border-color:#687df1}.primary{border:0;background:#345bec;color:#fff;font:inherit;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.6}.quiet{background:#f0f4fa;border:0;color:#3f567a;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.full{width:100%}.status{border:1px solid #d6e3f5;background:#f6f9ff;border-radius:12px;padding:14px;margin:14px 0;color:#4d6382;font-size:13px;line-height:1.8}.warn{color:#a44d38}.good{color:#087e64}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.request{padding:13px 0;border-bottom:1px solid #e9eff5}.request b{display:block}.request p{margin:4px 0;font-size:12px;color:#5d718c}.request small{font-size:11px;color:#9ca9b9}.tag{border-radius:99px;background:#f0f3f8;padding:4px 9px;font-size:11px;color:#566985}.foot{margin-top:23px;font-size:11px;color:#97a5b5;line-height:1.8}
</style></head><body><div class="box"><div class="brand"><div class="mark">◇</div><div>CaseLens <small style="font-size:10px;color:#8795aa;font-weight:600">企业内部工作台</small></div></div><p class="hint">此工作台需要管理员审批才能访问；每次新开浏览会话均需重新申请。管理员可使用专属通行码直接进入。</p>
<div class="tabs"><button id="visitorTab" class="on">申请访问</button><button id="adminTab">管理员入口</button></div>
<section id="visitorPanel"><form id="applyForm"><div class="field"><label>姓名或称呼</label><input id="visitorName" maxlength="55" required placeholder="例如：张三 / 运营一组"></div><div class="field"><label>申请用途</label><textarea id="visitorPurpose" maxlength="200" required placeholder="例如：查看社媒案例，开展内部培训"></textarea></div><button class="primary full" type="submit">提交访问申请</button></form><div id="waiting" class="hidden"><div class="status" id="userStatus">申请已经提交，正在等待管理员审批……</div><div class="actions"><button class="quiet" id="checkBtn">刷新审批状态</button><button class="quiet" id="cancelLocal">重新填写申请</button></div></div></section>
<section id="adminPanel" class="hidden"><div id="loginArea"><div class="field"><label>管理员专属通行码</label><input type="password" id="adminCode" autocomplete="off" placeholder="填写 Render 中设置的主通行码"></div><button class="primary full" id="adminLogin">管理员验证</button></div><div id="approvalArea" class="hidden"><div class="actions" style="margin-bottom:12px"><button id="enterAsAdmin" class="primary">直接进入工作台</button><button id="refreshRequests" class="quiet">刷新申请</button></div><div id="pendingList"></div></div></section>
<div id="error" class="status warn hidden"></div><div class="foot">批准只对当前浏览会话有效。关闭标签页后一般需要重新申请；浏览器的“恢复上次会话”可能保留原会话，请勿将其当作设备级登出。管理员可在审批台撤销已批准的访问。<br>系统不再接受原来的共享用户名/密码直接进入案例数据。</div>
</div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let timer=null;
const reqKey='caselens_pending_v11',accessKey='caselens_access_v11';
const readReq=()=>{try{return JSON.parse(sessionStorage.getItem(reqKey)||'null')}catch{return null}};
const note=(msg)=>{$('error').textContent=msg;$('error').classList.remove('hidden')};const clearNote=()=>$('error').classList.add('hidden');
async function call(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'服务器返回 '+r.status);return j}
function mode(admin){$('visitorPanel').classList.toggle('hidden',admin);$('adminPanel').classList.toggle('hidden',!admin);$('visitorTab').classList.toggle('on',!admin);$('adminTab').classList.toggle('on',admin);clearNote()}
$('visitorTab').onclick=()=>mode(false);$('adminTab').onclick=()=>mode(true);
async function enterApp(tok){const r=await fetch('/app',{headers:{Authorization:'Bearer '+tok},cache:'no-store'});if(!r.ok){sessionStorage.removeItem(accessKey);throw Error('访问许可已失效，请重新申请或联系管理员')};const html=await r.text();document.open();document.write(html);document.close()}
async function status(){const req=readReq();if(!req)return;try{const j=await call('/api/access/status?id='+encodeURIComponent(req.request_id),{headers:{'X-Request-Token':req.secret}});if(j.status==='approved'){$('userStatus').innerHTML='申请已通过，正在打开工作台……';sessionStorage.setItem(accessKey,req.secret);clearInterval(timer);await enterApp(req.secret)}else if(j.status==='pending'){$('userStatus').textContent='申请已提交，等待管理员审批。审批后会自动进入工作台。'}else{$('userStatus').textContent='当前申请状态：'+({rejected:'已拒绝',revoked:'已撤销',expired:'已过期',not_found:'找不到申请'}[j.status]||j.status)+'。请重新提交申请。';clearInterval(timer)}}catch(e){note(e.message)}}
function waiting(){if(!readReq())return;$('applyForm').classList.add('hidden');$('waiting').classList.remove('hidden');clearInterval(timer);timer=setInterval(status,4000);status()}
$('applyForm').onsubmit=async e=>{e.preventDefault();clearNote();try{const j=await call('/api/access/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('visitorName').value,purpose:$('visitorPurpose').value})});sessionStorage.setItem(reqKey,JSON.stringify(j));waiting()}catch(e){note(e.message)}};
$('checkBtn').onclick=status;$('cancelLocal').onclick=()=>{sessionStorage.removeItem(reqKey);clearInterval(timer);$('waiting').classList.add('hidden');$('applyForm').classList.remove('hidden');clearNote()};
$('adminLogin').onclick=async()=>{clearNote();try{const j=await call('/api/access/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('adminCode').value})});$('adminCode').value='';sessionStorage.setItem(accessKey,j.token);$('loginArea').classList.add('hidden');$('approvalArea').classList.remove('hidden');await list()}catch(e){note(e.message)}};
async function list(){const tok=sessionStorage.getItem(accessKey);try{const j=await call('/api/access/requests',{headers:{Authorization:'Bearer '+tok}});const root=$('pendingList');root.replaceChildren();let pending=j.items.filter(x=>x.status==='pending'),approved=j.items.filter(x=>x.status==='approved');const h=document.createElement('h3');h.textContent='待审批 · '+pending.length;root.append(h);for(const v of [...pending,...approved]){const item=document.createElement('div');item.className='request';const b=document.createElement('b');b.textContent=v.name+' · '+(v.status==='pending'?'等待审批':'已批准');const p=document.createElement('p');p.textContent=v.purpose;const t=document.createElement('small');t.textContent=new Date(v.created_at*1000).toLocaleString('zh-CN');item.append(b,p,t);const group=document.createElement('div');group.className='actions';group.style.marginTop='8px';for(const [action,label] of (v.status==='pending'?[['approved','通过'],['rejected','拒绝']]:[['revoked','撤销权限']])){const btn=document.createElement('button');btn.className=action==='approved'?'primary':'quiet';btn.textContent=label;btn.onclick=async()=>{try{await call('/api/access/decide',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({request_id:v.request_id,action})});await list()}catch(e){note(e.message)}};group.append(btn)}item.append(group);root.append(item)}if(!pending.length){const p=document.createElement('p');p.className='hint';p.textContent='当前没有待审批申请。';root.insertBefore(p,root.children[1]||null)}}catch(e){note(e.message)}}
$('refreshRequests').onclick=list;$('enterAsAdmin').onclick=()=>enterApp(sessionStorage.getItem(accessKey)).catch(e=>note(e.message));
(async()=>{const tok=sessionStorage.getItem(accessKey);if(tok){try{await enterApp(tok);return}catch(e){sessionStorage.removeItem(accessKey)}}if(readReq())waiting()})();
})();</script></body></html>
